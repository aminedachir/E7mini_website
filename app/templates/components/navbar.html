{% from "components/macros.html" import logo with context %}
<header class="site-header">
  <div class="container">
    <nav class="navbar" aria-label="التنقل الرئيسي">
      <a class="navbar-brand" href="{{ url_for('main.home') }}">
        {{ logo("logo-nav") }}
        <span class="navbar-title">{{ APP_NAME }}</span>
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
        <span class="nav-toggle-bars" aria-hidden="true"></span>
        <span class="visually-hidden">القائمة</span>
      </button>

      <div class="nav-menu" id="nav-menu">
        {# منطقة التنقل: تُضاف روابط الوحدات هنا عند تنفيذها فقط. #}
        <ul class="nav-links">
          <li>
            <a class="nav-link" href="{{ url_for('main.home') }}"
               {% if request.endpoint == 'main.home' %}aria-current="page"{% endif %}>الرئيسية</a>
          </li>
        </ul>

        <div class="nav-auth">
          {% if current_user.is_authenticated %}
            <span class="nav-user">مرحبًا، {{ current_user.name }}</span>
            <form method="post" action="{{ url_for('auth.logout') }}">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button type="submit" class="btn btn-outline btn-sm">تسجيل الخروج</button>
            </form>
          {% else %}
            <a class="btn btn-outline btn-sm" href="{{ url_for('auth.login') }}">تسجيل الدخول</a>
            <a class="btn btn-primary btn-sm" href="{{ url_for('auth.register') }}">إنشاء حساب</a>
          {% endif %}
        </div>
      </div>
    </nav>
  </div>
</header>
